<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>115-1 特教班高組國文段考｜PAD評量</title><style>
:root{font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#24334b;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}header{background:#173b65;color:white;padding:20px max(20px,calc((100vw - 950px)/2))}header h1{margin:0;font-size:1.45rem}header p{margin:6px 0 0;color:#d7e9ff}.shell{max-width:950px;margin:auto;padding:18px}.card{background:white;border-radius:18px;box-shadow:0 3px 16px #1a365020;padding:22px;margin-bottom:18px}.muted{color:#53667d}.line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.line>*{flex:1}input[type=text],select{border:2px solid #c7d7e7;border-radius:10px;padding:12px;font-size:1rem;min-width:0;width:100%}button{font:inherit;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;touch-action:manipulation}button.primary{background:#1863a6;color:white}button.secondary{background:#e7eff8;color:#173b65}button:disabled{opacity:.4;cursor:not-allowed}.btnrow{display:flex;gap:10px;flex-wrap:wrap}.btnrow button{flex:1;min-width:120px}.option{display:block;width:100%;text-align:left;background:#f5f9fd;border:2px solid #dbe6f0;padding:15px;margin:9px 0;border-radius:12px;line-height:1.6}.option.selected{border-color:#236cb1;background:#e5f2ff}.pill{border:2px solid #b5cee5;background:white;color:#173b65;line-height:1.5}.pill:disabled{background:#eef1f5;color:#a0aab6}.sentence{min-height:80px;padding:16px;border-radius:12px;background:#f2f7fd;margin:14px 0;line-height:1.8;font-size:1.13rem}.num{font-weight:800;color:#175d9e}.section{font-weight:700;color:#185c95}.progress{height:10px;border-radius:10px;background:#dbe5ee;overflow:hidden}.progress>div{background:#2b80bd;height:100%;transition:width .2s}.foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.foot button{min-width:110px}.hide{display:none}.note{background:#fff8e7;padding:13px;border-left:4px solid #e5a53a;border-radius:8px}fieldset{border:1px solid #dce6f0;border-radius:12px;margin:12px 0;padding:12px}legend{font-weight:700}.small{font-size:.9rem}#result{white-space:pre-line}.done{color:#16704c} @media(max-width:650px){.shell{padding:10px}.card{padding:16px}header{padding:18px}.line>*{flex-basis:100%}.foot button{min-width:0;flex:1}}
</style></head><body><header><h1>115-1 特教班高組｜國文段考</h1><p>PAD互動評量・60分・共17題</p></header><main class="shell"><section class="card" id="intro"><h2>考生資料</h2><p class="muted">請輸入姓名，確認後開始作答。題目可以返回修改，提交前不顯示正誤。</p><div class="line"><label>學生姓名<input id="student" type="text" autocomplete="off" placeholder="請輸入姓名"></label><label>班級／組別<input id="klass" type="text" value="特教班高組"></label></div><p class="note">請先完成所有題目，再按「提交並下載作答紀錄」。若中途離開，同一台裝置、同一瀏覽器會自動保存草稿。請勿使用無痕模式。</p><button class="primary" id="start">開始作答</button></section><section id="exam" class="hide"><div class="card"><div class="line"><strong id="who"></strong><span id="counter" class="muted" style="text-align:right"></span></div><div class="progress" aria-label="作答進度"><div id="bar" style="width:0"></div></div></div><article class="card" id="question"></article><div class="card"><div class="foot"><button class="secondary" id="prev">上一題</button><button class="secondary" id="next">下一題</button></div><p class="muted small" id="saved"></p></div><section class="card hide" id="submitSection"><h3>完成後提交</h3><p id="status"></p><button class="primary" id="submit">提交並下載作答紀錄</button><p class="muted small">下載的檔案請交給老師。PAD分數由教師端依答案核算；本頁不向學生顯示正確答案。</p><div id="result" class="hide note"></div></section></section></main><script>
const QUESTIONS=[{"id": 1, "kind": "single", "title": "自律", "stem": "下課時，小宇還沒有準備好下一節課的用品。他應該怎麼做？", "options": ["先去玩，等上課再準備。", "先準備課本和鉛筆盒，再去休息。", "不用準備，直接坐著等上課。"], "answer": 1, "points": 2, "parts": null}, {"id": 2, "kind": "single", "title": "安全", "stem": "因為走廊上有很多同學正在走動，所以不適合在走廊＿＿＿＿。", "options": ["慢慢走路", "快速追逐", "排隊"], "answer": 1, "points": 2, "parts": null}, {"id": 3, "kind": "single", "title": "事實與猜測", "stem": "小明不小心碰到小美的桌子，小美的鉛筆盒掉到地上。下面哪一句是已經知道的事實？", "options": ["小明故意把鉛筆盒弄掉。", "小明一定很討厭小美。", "小明碰到桌子，鉛筆盒掉到地上。"], "answer": 2, "points": 2, "parts": null}, {"id": 4, "kind": "single", "title": "情緒", "stem": "小安聽到老師說明天要上台介紹作品，他一直擔心自己會忘記要說的話。小安可能覺得＿＿＿＿。", "options": ["緊張", "開心", "生氣"], "answer": 0, "points": 2, "parts": null}, {"id": 5, "kind": "single", "title": "彈性思考", "stem": "小宇發現自己寫錯一個字，現在還有十分鐘，而且可以修改。他可以選擇＿＿＿＿。", "options": ["再試一次", "一直責怪自己", "放棄整張學習單"], "answer": 0, "points": 2, "parts": null}, {"id": 6, "kind": "order", "title": "適當拒絕", "stem": "同學邀請你去玩，但是你還沒準備好下一節課的用品。請排列成通順的句子。", "options": null, "answer": [1, 3, 2, 0], "points": 4, "parts": ["再跟你一起玩", "我現在不能去", "等我準備好", "因為我要先準備上課"]}, {"id": 7, "kind": "order", "title": "下課安全", "stem": "同學在走廊快速奔跑。請排列成通順的句子。", "options": null, "answer": [2, 0, 1, 3], "points": 4, "parts": ["可能會撞到別人", "因為走廊有很多人走動", "在走廊快速奔跑", "所以不要在走廊快速奔跑"]}, {"id": 8, "kind": "order", "title": "事件四線索", "stem": "下課時發生了鉛筆盒掉落的事情。請依照事件順序排列。", "options": null, "answer": [2, 3, 0, 1], "points": 4, "parts": ["不小心碰到小美的桌子", "結果鉛筆盒掉到地上", "下課的時候", "小明在教室後面玩猜拳"]}, {"id": 9, "kind": "order", "title": "情緒與下一步", "stem": "作業還沒完成，老師要帶大家換教室。請排列成通順的句子。", "options": null, "answer": [2, 1, 0, 3], "points": 4, "parts": ["因為我的作業還沒有寫完", "我覺得很擔心", "剛才老師說要換教室", "所以我可以先收好作業"]}, {"id": 10, "kind": "order", "title": "彈性思考", "stem": "圖畫還沒完成，但是上課時間到了。請排列成通順的句子。", "options": null, "answer": [2, 1, 0, 3], "points": 4, "parts": ["所以我決定先去上課", "因為現在已經上課了", "我還想把圖畫完成", "等有時間再繼續畫"]}, {"id": 11, "kind": "single", "title": "下課安全導航儀", "stem": "下列哪個活動比較安全？情境A：在走廊快速追逐。情境B：在教室內玩猜拳。", "options": ["情境A，因為走廊比較長。", "情境B，因為不需要奔跑，比較不容易撞到人。", "兩個活動一定都不安全。"], "answer": 1, "points": 4, "parts": null}, {"id": 12, "kind": "single", "title": "校園小偵探", "stem": "小明在教室後面跑步，不小心撞到小華，小華的水壺掉到地上。哪一句說得最清楚？", "options": ["他撞我！", "小明很壞，他故意撞我！", "下課時，小明在教室後面跑步，不小心撞到我，結果我的水壺掉到地上。"], "answer": 2, "points": 4, "parts": null}, {"id": 13, "kind": "multi", "title": "辨認情緒", "stem": "小安畫了很久的圖畫，老師說現在要收拾，準備去上體育課。小安很想繼續畫。小安可能有什麼感覺？（複選）", "options": ["難過，因為他還沒有畫完。", "生氣，因為他不想現在停止。", "一定很開心，因為可以馬上離開教室。", "擔心，因為他不知道什麼時候能繼續完成。"], "answer": [0, 1, 3], "points": 4, "parts": null}, {"id": 14, "kind": "single", "title": "不卡住的魔法", "stem": "小宇還有一題沒寫完，老師說：「時間到了，大家要換教室。」哪個方法能幫助小宇繼續往下走？", "options": ["一直問：「為什麼我沒有寫完？」", "先收好學習單，詢問老師什麼時候可以繼續完成。", "堅持現在一定要把整張學習單重寫一次。"], "answer": 1, "points": 4, "parts": null}, {"id": 15, "kind": "single", "title": "彈性思考", "stem": "小安正在畫一張圖畫，但是還沒有畫完。情境①：現在是下課時間，還有10分鐘可以畫畫。情境②：上課鐘響了，老師請大家收好東西，準備去上課。小安在這兩種情況下，應該怎麼做？", "options": ["情境①可以繼續畫；情境②先收好圖畫，跟大家去上課。", "情境①和情境②都要把圖畫完成，才能做下一件事。", "情境①和情境②都不要再畫，直接把圖畫丟掉。"], "answer": 0, "points": 4, "parts": null}, {"id": 16, "kind": "order", "title": "電話對話排序", "stem": "請依照合理的先後順序，排列接電話時的語句。", "options": null, "answer": [1, 2, 5, 3, 4, 0], "points": 5, "parts": ["好的，我會幫您轉告林老師。再見！", "您好，這裡是特教班辦公室。", "請問您找哪一位老師？", "林老師現在不在，請問有什麼事情需要轉告？", "我再確認一次，您是說今天下午兩點開會，對嗎？", "我是教務處王老師，找林老師。請轉告她今天下午兩點開會。"]}, {"id": 17, "kind": "phone", "title": "聽電話，找出重要訊息", "stem": "請先聽老師的電話留言，再選出正確資訊。", "options": null, "answer": [0, 1, 1, 2, 0], "points": 5, "parts": [["誰打來？", ["王老師", "小明", "家長"]], ["找誰？", ["小安", "林老師", "小美"]], ["什麼時間？", ["上午十點", "下午兩點", "下午四點"]], ["什麼地點？", ["圖書館", "操場", "二樓會議室"]], ["要帶什麼？", ["學生資料", "鉛筆盒", "水壺"]]]}];
const KEY='cljhs_1151_A_midterm_v1';
const PHONE_SCRIPT='您好，我是教務處的王老師。請幫我轉告林老師，今天下午兩點要到二樓會議室開會，記得帶學生資料。謝謝！';
let audioPlays=0;
let state={student:'',klass:'特教班高組',answers:{},index:0,submitted:false};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&typeof x==='object')state={...state,...x}}catch(e){}
const $=id=>document.getElementById(id);
$('student').value=state.student||'';$('klass').value=state.klass||'特教班高組';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));$('saved').textContent='草稿已儲存於此裝置。'}catch(e){$('saved').textContent='無法儲存草稿，請勿關閉頁面。'}};
const ans=q=>state.answers[q.id];
const answered=q=>{const a=ans(q);return q.kind==='order'?Array.isArray(a)&&a.length===q.parts.length:q.kind==='multi'?Array.isArray(a)&&a.length>0:q.kind==='phone'?Array.isArray(a)&&a.every(v=>v!==null&&v!==undefined):Number.isInteger(a)};
function render(){const q=QUESTIONS[state.index];$('who').textContent=state.student+'｜'+state.klass;$('counter').textContent=`第 ${state.index+1} / ${QUESTIONS.length} 題`;$('bar').style.width=((state.index+1)/QUESTIONS.length*100)+'%';
let h=`<div class="section">${q.id<=5?'第一大題｜語詞與句型':q.id<=10?'第二大題｜句子排列':q.id<=15?'第三大題｜情境判斷':'第四大題｜電話對話與留言'}</div><h2><span class="num">第 ${q.id} 題</span>　${esc(q.title)} <small class="muted">(${q.points}分)</small></h2><p>${esc(q.stem)}</p>`;
if(q.kind==='single'||q.kind==='multi'){h+=q.options.map((x,i)=>`<button class="option ${q.kind==='single'&&ans(q)===i||q.kind==='multi'&&(ans(q)||[]).includes(i)?'selected':''}" data-choice="${i}" aria-pressed="${q.kind==='single'&&ans(q)===i||q.kind==='multi'&&(ans(q)||[]).includes(i)}">${'ABCD'[i]}. ${esc(x)}</button>`).join('');if(q.kind==='multi')h+='<p class="muted">本題可以選擇多個答案。</p>'}
if(q.kind==='order'){const a=ans(q)||[];h+=`<p class="muted">依序點選語塊；如需修改可按「重新排列」。</p><div class="sentence">${a.length?a.map(i=>esc(q.parts[i])).join('，')+(a.length===q.parts.length?'。':''):'請從下方選擇第一個語塊……'}</div><div class="btnrow">${q.parts.map((x,i)=>`<button class="pill" data-part="${i}" ${a.includes(i)?'disabled':''}>${esc(x)}</button>`).join('')}</div><p><button class="secondary" id="resetorder">重新排列</button></p>`}
if(q.kind==='phone'){const a=ans(q)||[null,null,null,null,null];h+=`<div class="note"><strong>電話留言</strong><p>請按下播放鍵，仔細聽電話內容；可以重播一次。</p><button class="primary" id="playAudio" type="button">🔊 播放電話留言</button><p id="audioCount" class="small muted"></p></div>`;q.parts.forEach((part,i)=>{h+=`<fieldset><legend>${i+1}. ${esc(part[0])}</legend>`+part[1].map((x,j)=>`<button class="option ${a[i]===j?'selected':''}" data-phone="${i}" data-pick="${j}">${'ABC'[j]}. ${esc(x)}</button>`).join('')+'</fieldset>'})}
$('question').innerHTML=h;$('submitSection').classList.toggle('hide',state.index!==QUESTIONS.length-1);$('prev').disabled=state.index===0;$('next').disabled=state.index===QUESTIONS.length-1;$('status').textContent=`已完成 ${QUESTIONS.filter(answered).length} / ${QUESTIONS.length} 題`;
if(q.kind==='phone'){const b=$('playAudio');$('audioCount').textContent='已播放 '+audioPlays+' 次（最多2次）';b.disabled=audioPlays>=2;b.onclick=()=>{if(audioPlays>=2)return;if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音播放，請由教師朗讀題目。');return;}audioPlays++;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(PHONE_SCRIPT);u.lang='zh-TW';u.rate=.86;speechSynthesis.speak(u);$('audioCount').textContent='已播放 '+audioPlays+' 次（最多2次）';b.disabled=audioPlays>=2;};}
$('question').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const i=+b.dataset.choice;if(q.kind==='multi'){let a=[...(ans(q)||[])];a=a.includes(i)?a.filter(x=>x!==i):[...a,i];state.answers[q.id]=a.sort()}else state.answers[q.id]=i;save();render()});
$('question').querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{state.answers[q.id]=[...(ans(q)||[]),+b.dataset.part];save();render()});
if($('resetorder'))$('resetorder').onclick=()=>{state.answers[q.id]=[];save();render()};
$('question').querySelectorAll('[data-phone]').forEach(b=>b.onclick=()=>{let a=[...(ans(q)||[null,null,null,null,null])];a[+b.dataset.phone]=+b.dataset.pick;state.answers[q.id]=a;save();render()});
}
function start(){state.student=$('student').value.trim();state.klass=$('klass').value.trim();if(!state.student){alert('請先輸入學生姓名。');return}save();$('intro').classList.add('hide');$('exam').classList.remove('hide');render()}
$('start').onclick=start;$('prev').onclick=()=>{state.index--;save();render();scrollTo(0,0)};$('next').onclick=()=>{state.index++;save();render();scrollTo(0,0)};
function score(){let total=0;for(const q of QUESTIONS){const a=ans(q);if(!answered(q))continue;if(q.kind==='single'&&a===q.answer)total+=q.points;else if(q.kind==='multi'&&JSON.stringify([...a].sort())===JSON.stringify([...q.answer].sort()))total+=q.points;else if(q.kind==='order'&&JSON.stringify(a)===JSON.stringify(q.answer))total+=q.points;else if(q.kind==='phone')total+=a.filter((v,i)=>v===q.answer[i]).length}return total}
$('submit').onclick=()=>{const missing=QUESTIONS.filter(q=>!answered(q)).map(q=>q.id);if(missing.length&&!confirm(`還有 ${missing.length} 題尚未完成（第 ${missing.join('、')} 題）。確定要提交嗎？`))return;if(!confirm('確認提交？提交後會下載作答紀錄，請交給老師。'))return;const result={exam:'115-1 特教班高組國文段考 PAD V1.0',student:state.student,klass:state.klass,submittedAt:new Date().toISOString(),padMax:60,padScore:score(),answers:QUESTIONS.map(q=>({question:q.id,type:q.kind,points:q.points,response:ans(q)??null}))};const blob=new Blob([JSON.stringify(result,null,2)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`115-1-高組國文-PAD-${state.student.replace(/[\\/:*?"<>|]/g,'')}.json`;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);state.submitted=true;save();$('result').classList.remove('hide');$('result').textContent='已完成提交並嘗試下載作答紀錄。請確認下載資料夾內有 JSON 檔案，並交給老師。';};
if(state.student){$('student').value=state.student;$('klass').value=state.klass}
</script></body></html>
