[]},{"label":"第19題","text":"【田園之秋選】\n05. (B) 氣脫委頓 (D) 失魂落魄","options":[]},{"label":"第20題","text":"【田園之秋選】\n06. 「一場為時一小時的大西北雨」，寫出西北雨的哪些特色？","options":[]},{"label":"第21題","text":"【田園之秋選】\n06. (A) 來去匆匆 (C) 時斷時續","options":[]},{"label":"第22題","text":"【田園之秋選】\n06. (B) 及時甘霖 (D) 忽大忽小","options":[]},{"label":"第23題","text":"【田園之秋選】\n07. 下列哪個詞語的意思，哪一個最遙遠？","options":[]},{"label":"第24題","text":"【田園之秋選】\n07. (A) 一街之隔 (C) 天南地北","options":[]},{"label":"第25題","text":"【田園之秋選】\n07. (B) 一箭之地 (D) 近在咫尺","options":[]},{"label":"第26題","text":"【田園之秋選】\n08. 西北雨一文中著力描寫的部分，可用下列哪一項中的文句來概括？","options":[]},{"label":"第27題","text":"【田園之秋選】\n08. (A) 摘了一整天的番薯蒂","options":[]},{"label":"第28題","text":"【田園之秋選】\n08. (B) 大野中，孤伶伶的一個人","options":[]},{"label":"第29題","text":"【田園之秋選】\n08. (C) 一片清新的空氣、鮮潔的色彩","options":[]},{"label":"第30題","text":"【田園之秋選】\n08. (D) 大雨滂沱，霹靂環起","options":[]},{"label":"第31題","text":"【田園之秋選】\n09. 「白雪靄靄、江楓漁火、火傘高張、花香鳥語」以上成語按照四季順序應如何排列？","options":[]},{"label":"第32題","text":"【田園之秋選】\n09. (A) 白雪靄靄、江楓漁火、火傘高張、花香鳥語","options":[]},{"label":"第33題","text":"【田園之秋選】\n09. (B) 火傘高張、白雪靄靄、江楓漁火、花香鳥語","options":[]},{"label":"第34題","text":"【田園之秋選】\n09. (C) 花香鳥語、江楓漁火、火傘高張、白雪靄靄","options":[]},{"label":"第35題","text":"【田園之秋選】\n09. (D) 花香鳥語、火傘高張、江楓漁火、白雪靄靄","options":[]},{"label":"第1題","text":"【古體詩選】\n織女札札弄機杼，卻「終日不成章，泣涕零如雨。」原因何在？\n(A) 不熟練織布技巧 (C) 心事重重難專心\n(B) 須同時兼做他事 (D) 機杼老舊常故障","options":[]},{"label":"第2題","text":"【古體詩選】\n「河漢清且淺，相去復幾許？盈盈一水間，脈脈不得語。」意同下列哪一項？\n(A) 天涯若比鄰 (C) 有緣千里來相會\n(B) 可望不可及 (D) 既期待又怕受傷害","options":[]},{"label":"第3題","text":"【古體詩選】\n下列疊字詞，哪一項運用不恰當？\n(A) 他又「假惺惺」的對她故作殷勤了\n(B) 老闆正「氣呵呵」的在會議室喝斥失職的員工\n(C) 我最喜歡看她「笑咪咪」的樣子\n(D) 他是一位「響噹噹」的人物","options":[]},{"label":"第4題","text":"【古體詩選】\n(甲)「銀河清淺，玉露微茫，亙鵲橋於長空，運渡天孫於碧落」 (乙)「嫦娥應悔偷靈藥，碧海青天夜夜心」 (丙)「去年元夜時，花市燈如晝．月上柳梢頭，人約黃昏後」 (丁)「爆竹在庭，桃符在戶，柏酒在壼」 以上四段敘述，分別是指哪一個節慶？\n(A) 中秋、重陽、七夕、元宵\n(B) 七夕、中秋、除夕、端午\n(C) 元宵、中秋、除夕、七夕\n(D) 七夕、中秋、元宵、除夕","options":[]},{"label":"第5題","text":"【古體詩選】\n下列「去」字的用法，何者同於「晝夜不飛去」的「去」？\n(A) 相「去」復幾許\n(B) 冬天「去」合歡山晌雪是一大享受\n(C) 爺爺「去」世已經很多年了\n(D) 媽媽最愛「去」百貨公司逛街","options":[]},{"label":"第6題","text":"【古體詩選】\n下列「」中的代詞，哪個不是指慈烏？\n(A) 應是母慈重，使「爾」悲不任\n(B) 嗟哉斯徒輩，「其」心不如禽\n(C) 慈烏失「其」母，啞啞吐哀音\n(D) 百鳥豈無母，「爾」獨哀怨深","options":[]},{"label":"第7題","text":"【古體詩選】\n下列各句語氣的說明，何者正確？\n(A) 應是母慈重，使爾悲不任──推測的語氣\n(B) 嗟載斯徒輩，其心不如禽──感嘆的語氣\n(C) 慈烏復慈烏，鳥中之曾參──反諷的語氣\n(D) 昔有吾起者，母歿喪不臨──讚頌的語氣","options":[]},{"label":"第8題","text":"【古體詩選】\n下列何者與「樹欲靜而風不止，子欲養而親不待」的意思最為接近？\n(A) 晝夜不飛去，經年守故林\n(B) 聲中如告訴，未盡反哺心\n(C) 應是母慈重，使爾悲不任\n(D) 慈烏復慈烏，鳥中之曾參","options":[]},{"label":"第9題","text":"【古體詩選】\n據報載一位兒子因生意失敗，加上賭債纏身，竟然先替老父投下 上億元保險，再製造假車禍，將父親燒死在車內，意圖巨額保險 費。此舉可用下列何者形容？\n(A) 嗟哉斯徒輩，其心不如禽\n(B) 子欲養而親不待也\n(C) 聲中如告訴，未盡反哺心\n(D) 晝夜不飛去，經年守故林","options":[]},{"label":"第1題","text":"【詩體流變】\n有關古體詩與近體詩之敘述，下列哪一項不正確？\n(A) 古體詩多為士人之作，只可誦，不可歌，多言情，尚溫雅\n(B) 近體詩風格，一般分為四派：社會、浪漫、邊塞、田園\n(C) 古體詩至唐朝以後就無人再創作\n(D) 近體詩字句數固定，講求平仄對仗，不可換韻。風格典雅、優美","options":[]},{"label":"第2題","text":"【詩體流變】\n□□□□□ □□□□□ □□□□□ □□□□□ 這個形式最可能是哪一種詩？\n(A) 五言絕句 (C) 五言律詩\n(B) 七言絕句 (D) 現代詩","options":[]},{"label":"第3題","text":"【詩體流變】\n今天的天空 像一張剛洗好的藍色床單 雲慢慢走過 我坐在窗邊 等風帶來消息 這首詩最可能是哪一種？\n(A) 古詩 (C) 七言律詩\n(B) 五言絕句 (D) 現代詩","options":[]},{"label":"第4題","text":"【詩體流變】\n只看到一首詩有4句，能立刻確定是絕句嗎？\n(A) 不能，因為絕句有８句\n(B) 不能，還要看字數和規則\n(C) 能，一定是古詩\n(D) 能，一定是絕句","options":[]},{"label":"第5題","text":"【詩體流變】\n七言律詩共有多少字？\n(A) 28字 (B) 56字 (C) 20字 (D) 40字","options":[]},{"label":"第6題","text":"【詩體流變】\n近體詩通常哪些句子押韻？\n(A) 完全沒有規則 (C) 奇數句\n(B) 每一句 (D) 偶數句","options":[]},{"label":"第1題","text":"【語文天地－詞類】\n下列各選項「 」中連詞的使用，何者不完全正確？\n(A) 「就算」兩地相距不遠，「仍然」無法天天見面\n(B) 「雖然」一年只見一次面，「可是」總比永遠無法見面好\n(C) 「除非」有人穿針引線，「然後」他倆是不可能相識的\n(D) 「只要」有決心和毅力，「哪怕」任務再多艱難也不成問題","options":[]},{"label":"第2題","text":"【語文天地－詞類】\n「小孩在綠油油的草地上嬉戲」，句中的「綠油油」是形容詞。下列文句「 」的語詞，何者也是形容詞？\n(A) 大冷天，吃到「熱騰騰」的肉圓，真開心\n(B) 憲兵「直挺挺」的站在司令臺前，一動也不動\n(C) 因為誤會，小華「氣沖沖」的跑過來向我興師問罪\n(D) 他「眼睜睜」的看著考試時間流逝，卻不知如何作答","options":[]},{"label":"第3題","text":"【語文天地－詞類】\n下列「 」中的連接詞，何者運用正確？\n(A) 他「與其」忍受牙痛，「也不願」去看醫生\n(B) 你「既然」知道做錯了，「也要」反省改進\n(C) 他「因為」考得很理想，「於是」犧牲睡眠\n(D) 我「要是」不看電視，「早就」做完功課了","options":[]},{"label":"第4題","text":"【語文天地－詞類】\n下列「 」中的字，何組詞性相同？\n(A) 何謂「也」？／「喔」！是這樣嗎\n(B) 老師來「自」臺南／他坐「在」椅子上\n(C) 天仙「或」白馬王子／這件事跟「他」無關\n(D) 小「而」瘦／走一「遭」","options":[]},{"label":"第55題","text":"【語文天地－詞類】\n詞性判別：","options":[]},{"label":"第56題","text":"【語文天地－詞類】\n實詞：名詞、代詞、動詞、形容詞、副詞、數詞、量詞 虛詞：介詞、連詞、助詞、嘆詞","options":[]},{"label":"第57題","text":"【語文天地－詞類】\n「唉」！我現在想想，那時真是太聰明了！\n夕陽斜映「在」斑駁的磚牆上。\n「他們」堅持要繼續走下去。\n夏天的夜就輕輕地來「了」！\n羊隊「和」牛群告別了田野回家了。\n「啊」！好像棋盤似的。\n「纖纖」擢素手，札札弄機杼。\n長長一生莫非這樣一「場」遊戲吧。\n這是我「酷」愛這一帶旱地，而不喜歡外邊水田田莊的理由。\n我與父親不相見已二年餘了，我最不能忘記的是「他」的背影。","options":[]}]},{"title":"第八大題【譬喻修辭】　每題１分","items":[{"label":"第1題","text":"凡兩件或兩件以上的事物中有類似之點，說話作文時運用「那」有類似點的事物，來比方說明「這」件事物，稱為「譬喻」，如本課即將「滿天的烏雲」譬喻為「黑怪」。","options":[]},{"label":"第3題","text":"1.雨點是一群快樂的（　丙　），在水面上展現曼妙的舞姿。","options":[]},{"label":"第4題","text":"2.黃澄澄的稻子就像（　乙　），美麗極了。","options":[]},{"label":"第5題","text":"3.（　甲　）好像甜蜜的棉花糖，吃一口就可以回味好久。","options":[]},{"label":"第6題","text":"4.我的心像一座（　丁　），在陽光下湧溢著七彩的水珠。","options":[]}],"shared":[{"label":"共用選項／說明","text":"甲、童年的回憶 乙、金黃色的地毯 丙、芭蕾舞者 丁、噴泉","options":[]}]},{"title":"第九大題【誇飾修辭】將句子中使用誇飾修詞的語詞圈起來。","items":[{"label":"第1題","text":"1.\t我費了九牛二虎之力，才把家裡打掃得乾乾淨淨。","options":[]},{"label":"第2題","text":"2.這本書的內容引人入勝，我看過許多遍，簡直可以倒背如流。","options":[]},{"label":"第3題","text":"3.媽媽的廚藝精湛，道道拿手好菜都色、香、味俱全，令人垂涎三尺，吃得津津有味。","options":[]},{"label":"第4題","text":"4.雖然志偉吉人天相，在這次車禍中，幸運逃過一劫，但過程驚險，還是讓他嚇得魂飛魄散。","options":[]}]},{"title":"第十大題【看圖猜與「天氣」有關的成語】　每題１分","items":[{"label":"第1題","text":"撥雲　、　聽雷　、　駕霧　、　雨後　、　捕風　、　雪中","options":[]}]},{"title":"加分題【句子重組】　每格１分","items":[{"label":"第2題","text":"3 4","options":[]},{"label":"第3題","text":"１ 這是我 要把番薯蒂","options":[]},{"label":"第4題","text":"而不喜歡 一心一意","options":[]},{"label":"第5題","text":"的理由 趕快摘完","options":[]},{"label":"第6題","text":"外邊水田田莊 １ 低著頭","options":[]},{"label":"第7題","text":"酷愛這一帶旱地，","options":[]},{"label":"第8題","text":"5 6","options":[]},{"label":"第9題","text":"皎皎河漢女 晝夜不飛去，經年守故林","options":[]},{"label":"第10題","text":"終日不成章 １ 慈烏失其母","options":[]},{"label":"第11題","text":"泣涕零如雨 夜夜夜半啼，聞者為沾襟","options":[]},{"label":"第12題","text":"纖纖擢素手 啞啞吐哀音","options":[]},{"label":"第13題","text":"１ 迢迢牽牛星 聲中如告訴","options":[]},{"label":"第14題","text":"札札弄機杼 未盡反哺心","options":[]}],"shared":[{"label":"共用選項／說明","text":"1 2\n可名為 攫來\n大西北雨的 １ 只覺\n惡魔與妖巫之出世 滿天無數黑怪，\n序幕前奏， 盡向地面\n１ 像今天這種 張牙舞爪，","options":[]}]},{"title":"第十一大題【閱讀測驗】　每題２分","items":[{"label":"第1題","text":"「蘇力」八點出海，嚴防「甩尾」倒雨\n蘇力颱風「橫切」北臺灣，一夜肆虐過後，臺北街頭不少路樹倒塌，市區景象滿目瘡痍。中颱蘇力的颱風中心於今（13日）晨三時左右，在新北市、宜蘭縣交界處的三貂角登陸。\n氣象局今晨指出：蘇力颱風登陸後，速度稍稍增快，目前以每小時二十四公里速度，持續向西北行進。且碰觸臺灣陸地之後，蘇力的威力絲毫不減，仍維持中颱強度。颱風中心預計將在上午八時左右，從新竹附近出海。要到晚上，臺灣本島才會脫離暴風圈，並解除陸上颱風警報。\n蘇力離臺後，雖然風力會逐漸減弱，但仍需注意蘇力颱風引進的西南氣流，可能挾帶充沛雨量「甩尾」。氣象局也警告：中南部要嚴防西南風所帶來的降雨，山區甚至有超大豪雨發生的機率，瞬間的雨勢和累積的雨量都會相當驚人。","options":[]},{"label":"第2題","text":"( Ｂ ) 1.\t根據本文，有關颱風目前的最新動態，何者敘述正確？\n(A)中心位置在新竹外海　(B)強度持續維持為中颱\n(C)移動的方向轉成西南　(D)行進的速度絲毫不減","options":[]},{"label":"第3題","text":"( Ａ ) 2.\t根據本文，颱風行徑的路線，最可能是下列何者？\n(A)　　　　　　　　　　　　　　(B)　　 \n\n\n\n\n(C)　　　　　　　　　　　　　　(D)","options":[]},{"label":"第4題","text":"( Ｄ ) 3.\t根據本文，慎防蘇力「甩尾」倒雨的縣市不包括下列何者？\n(A)臺中市　(B)臺南市\n(C)高雄市　(D)新竹市","options":[]}]}];const g=document.getElementById('group'),q=document.getElementById('question'),stem=document.getElementById('stem'),choices=document.getElementById('choices');function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=+document.getElementById('rate').value;let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('zh-tw'));if(v)u.voice=v;speechSynthesis.speak(u)}function opt(t,v){let o=document.createElement('option');o.textContent=t;o.value=v;return o}data.forEach((s,i)=>g.add(opt(s.title,i)));function loadGroup(){speechSynthesis.cancel();q.replaceChildren();data[+g.value].items.forEach((it,i)=>q.add(opt(it.label,i)));loadQuestion()}function loadQuestion(){speechSynthesis.cancel();let s=data[+g.value],it=s.items[+q.value];if(!it)return;document.getElementById('heading').textContent=s.title+'｜'+it.label;stem.textContent=it.text;choices.replaceChildren();let panel=document.getElementById('sharedPanel'), sharedText=document.getElementById('sharedText'),sharedButtons=document.getElementById('sharedButtons');let shared=it.sharedOptions?it.sharedOptions.map((t,i)=>({text:String.fromCharCode(65+i)+' '+t})):(s.shared||[]);panel.hidden=!shared.length;sharedText.textContent='';sharedButtons.replaceChildren();shared.flatMap(x=>x.text.split(/\n/).filter(Boolean)).forEach(line=>{let b=document.createElement('button');b.className='choice';b.textContent='🔊 '+line;b.onclick=()=>say(line);sharedButtons.append(b)});let lines=it.sharedOptions?[]:it.text.split(/\n/).filter(Boolean);lines.forEach((line,i)=>{let b=document.createElement('button');b.className='choice';b.textContent='🔊 '+line;b.onclick=()=>say(line);choices.append(b)});document.getElementById('count').textContent='本大題可選擇 '+s.items.length+' 個題目／題組';}g.onchange=loadGroup;q.onchange=loadQuestion;document.getElementById('read').onclick=()=>{let s=data[+g.value],it=s.items[+q.value];say(it.text+(it.sharedOptions?.length?'。共用選項：'+it.sharedOptions.map((t,i)=>String.fromCharCode(65+i)+' '+t).join('。'):(s.shared?.length?'。共用選項：'+s.shared.map(x=>x.text).join('。'):'')))};document.getElementById('stop').onclick=()=>speechSynthesis.cancel();document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();loadGroup();</script></body></html>
