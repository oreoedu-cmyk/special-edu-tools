const sectionSel=document.getElementById('sectionSel'), questionSel=document.getElementById('questionSel'), speed=document.getElementById('speed');
const title=document.getElementById('title'), meta=document.getElementById('meta'), qText=document.getElementById('questionText'), choices=document.getElementById('choices'), countBadge=document.getElementById('countBadge'), speedBadge=document.getElementById('speedBadge');
function populateSections(){DATA.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.title;sectionSel.appendChild(o)});populateQuestions();render();}
function populateQuestions(){const s=DATA[+sectionSel.value]; questionSel.innerHTML=''; s.items.forEach((it,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`第 ${it[0]} 題`;questionSel.appendChild(o)});}
function render(){const s=DATA[+sectionSel.value], it=s.items[+questionSel.value]; meta.textContent=s.title; title.textContent=`第 ${it[0]} 題`; qText.textContent=it[1]; choices.innerHTML=''; (it[2]||[]).forEach((c,idx)=>{const d=document.createElement('button');d.type='button';d.className='choice';d.textContent=c;d.setAttribute('aria-label','朗讀選項 '+c);d.onclick=()=>speak(c);choices.appendChild(d)}); countBadge.textContent=`${+questionSel.value+1} / ${s.items.length}`; document.getElementById('prev').disabled=+questionSel.value===0; document.getElementById('next').disabled=+questionSel.value===s.items.length-1;}
function currentText(includeChoices=true){const s=DATA[+sectionSel.value], it=s.items[+questionSel.value]; let t=`${it[1]}`; if(includeChoices && it[2] && it[2].length) t += '。選項：' + it[2].join('。'); return t;}
function speak(txt){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang='zh-TW'; u.rate=parseFloat(speed.value); const voices=speechSynthesis.getVoices(); const zh=voices.find(v=>/zh|Chinese|Taiwan|Taiwanese/i.test(v.lang+v.name)); if(zh) u.voice=zh; speechSynthesis.speak(u);}
sectionSel.addEventListener('change',()=>{populateQuestions();render();}); questionSel.addEventListener('change',render); speed.addEventListener('input',()=>speedBadge.textContent=parseFloat(speed.value).toFixed(1)+' 倍');
document.getElementById('readAll').onclick=()=>speak(currentText(true)); document.getElementById('readQ').onclick=()=>speak(currentText(false)); document.getElementById('stop').onclick=()=>speechSynthesis.cancel();
document.getElementById('prev').onclick=()=>{questionSel.value=+questionSel.value-1;render();}; document.getElementById('next').onclick=()=>{questionSel.value=+questionSel.value+1;render();};
populateSections();


// PWA / 平板全螢幕輔助
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt', e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn'); if(b) b.classList.remove('hidden');});
document.getElementById('installBtn')?.addEventListener('click', async()=>{if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; document.getElementById('installBtn').classList.add('hidden');});
async function enterFullscreen(){try{const el=document.documentElement;if(el.requestFullscreen) await el.requestFullscreen(); else if(el.webkitRequestFullscreen) await el.webkitRequestFullscreen();}catch(e){}}
document.getElementById('fullscreenBtn')?.addEventListener('click', enterFullscreen);
let firstTap=false; document.addEventListener('pointerdown',()=>{ if(!firstTap){firstTap=true; enterFullscreen();}}, {once:true});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
